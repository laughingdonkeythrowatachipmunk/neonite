<!doctype html>
<html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Neon Rift Royale</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050817;font-family:Arial;color:#fff}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#ui{position:fixed;inset:0;pointer-events:none}
#logo{position:absolute;top:10px;left:50%;transform:translateX(-50%);font-weight:900;font-size:18px;letter-spacing:4px;color:#74f5ff;text-shadow:0 0 18px #00eaff}
#hud{position:absolute;top:12px;left:12px;padding:10px 13px;border:1px solid #4ef5ff66;background:#071022dd;border-radius:10px;min-width:230px}
#bar{height:9px;background:#26324b;margin-top:5px;border-radius:5px;overflow:hidden}.fill{height:100%}
#hp{background:#52ed6b}.shield{background:#4ce9ff}
#hint{position:absolute;bottom:10px;left:12px;background:#071022dd;border:1px solid #4ef5ff66;padding:8px 10px;border-radius:8px;font-size:12px}
#mobile{display:none}.round{position:absolute;border-radius:50%;background:#0d1936dd;color:#fff;border:1px solid #68efff99;font-weight:900}
@media(pointer:coarse),(max-width:700px){
 #logo{font-size:12px;letter-spacing:2px}
 #hint{font-size:9px;bottom:5px;left:5px}
 #mobile{display:block;position:absolute;inset:0;pointer-events:none}
 #joy{position:absolute;left:18px;bottom:34px;width:118px;height:118px;border:2px solid #63edff88;border-radius:50%;background:#071b2ccc;pointer-events:auto}
 #knob{position:absolute;left:37px;top:37px;width:40px;height:40px;border-radius:50%;background:#5aefff;box-shadow:0 0 18px #00eaff}
 #fire{right:18px;bottom:38px;width:94px;height:94px;pointer-events:auto}
 #dash{right:124px;bottom:30px;width:64px;height:64px;font-size:10px;pointer-events:auto}
}
#error{display:none;position:absolute;inset:20px;background:#170712;color:#fff;padding:20px;border:2px solid #ff4d8d;border-radius:12px;font-family:monospace;white-space:pre-wrap}
</style></head>
<body>
<canvas id="c"></canvas>
<div id="ui">
 <div id="logo">NEON RIFT ROYALE</div>
 <div id="hud">WAVE <b id="wave">1</b>/12 &nbsp; • &nbsp; ELIMS <b id="score">0</b>
  <div id="rarity">COMMON • PULSE RIFLE</div>
  <div id="bar"><div id="shield" class="fill shield"></div></div>
  <div id="bar"><div id="hp" class="fill"></div></div>
  <small>SHIELD / HP</small>
 </div>
 <div id="hint">WASD / arrows • mouse + click • Shift dash • R restart</div>
 <div id="mobile">
  <div id="joy"><div id="knob"></div></div>
  <button id="fire" class="round">FIRE</button>
  <button id="dash" class="round">DASH</button>
 </div>
 <div id="error"></div>
</div>
<script>
(function(){
"use strict";
var canvas=document.getElementById("c"),ctx=canvas.getContext("2d");
var W=0,H=0,dpr=1,keys={},mouse={x:0,y:0,down:false},joy={x:0,y:0};
var p,enemies,shots,loot,parts,wave,score,over,won,dashCD;
var rarities=[
 ["COMMON","#bfc6d1",1],["UNCOMMON","#45df6d",1.15],["RARE","#4ba5ff",1.35],
 ["EPIC","#b65aff",1.65],["LEGENDARY","#ffb52e",2],["MYTHIC","#ff4e91",2.45],
 ["EXOTIC","#42efd2",2.9],["EXILED","#e76cff",3.5]
];
var weapons=["PULSE RIFLE","NEON SMG","RIFT AR","VOID BURST","SOLAR CANNON","MYTHIC REAPER","EXOTIC ARC","EXILED ZERO"];

function resize(){W=innerWidth;H=innerHeight;dpr=Math.min(devicePixelRatio||1,2);canvas.width=W*dpr;canvas.height=H*dpr;canvas.style.width=W+"px";canvas.style.height=H+"px";ctx.setTransform(dpr,0,0,dpr,0,0)}
function r(a,b){return Math.random()*(b-a)+a}
function d(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function rarity(){return Math.min(7,Math.max(0,wave<2?0:wave<4?1:wave<6?2:wave<8?3:wave<10?4:wave<11?5:wave<12?6:7))}
function enemy(){var a=r(0,Math.PI*2),rad=r(300,Math.min(W,H)*.52),elite=wave>=5&&Math.random()<.12, hp=(35+wave*8)*(elite?2.2:1);return{x:W/2+Math.cos(a)*rad,y:H/2+Math.sin(a)*rad,hp:hp,max:hp,elite:elite,spd:r(.7,1.15)+wave*.04,cool:r(20,80)}}
function start(){p={x:W/2,y:H/2,hp:100,sh:100,cool:0,weapon:rarity()};enemies=[];shots=[];loot=[];parts=[];wave=1;score=0;over=false;won=false;dashCD=0;spawn();hud()}
function spawn(){enemies=[];var n=Math.min(5+wave*2,28);for(var i=0;i<n;i++)enemies.push(enemy())}
function burst(x,y,col,n){for(var i=0;i<(n||8);i++)parts.push({x:x,y:y,vx:r(-2,2),vy:r(-2,2),life:r(15,35),c:col})}
function shoot(o,tx,ty){var a=Math.atan2(ty-o.y,tx-o.x),own=o===p,ri=own?rarity():0,damage=own?(18+ri*10)*rarities[ri][2]:7+wave*.7;shots.push({x:o.x+Math.cos(a)*18,y:o.y+Math.sin(a)*18,vx:Math.cos(a)*(own?12:6),vy:Math.sin(a)*(own?12:6),team:own?"p":"e",life:90,damage:damage,col:own?rarities[ri][1]:"#ff4d8d"})}
function hud(){document.getElementById("wave").textContent=wave;document.getElementById("score").textContent=score;var ri=rarity();document.getElementById("rarity").textContent=rarities[ri][0]+" • "+weapons[ri];document.getElementById("rarity").style.color=rarities[ri][1];document.getElementById("hp").style.width=Math.max(0,p.hp)+"%";document.getElementById("shield").style.width=p.sh+"%"}
function update(){
 if(over)return;
 var dx=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0)+joy.x,dy=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0)+joy.y,len=Math.hypot(dx,dy)||1;
 if(Math.abs(joy.x)+Math.abs(joy.y)>.05){mouse.x=p.x+joy.x*500;mouse.y=p.y+joy.y*500}
 p.x=Math.max(20,Math.min(W-20,p.x+dx/len*3.8));p.y=Math.max(65,Math.min(H-20,p.y+dy/len*3.8));
 if(p.cool>0)p.cool--;if(dashCD>0)dashCD--;
 if((keys.shift||keys["shift"])&&dashCD<=0){p.x+=dx/len*90;p.y+=dy/len*90;dashCD=70;burst(p.x,p.y,"#e66cff",14)}
 if((mouse.down||keys[" "])&&p.cool<=0){shoot(p,mouse.x,mouse.y);p.cool=rarity()<4?10:6}
 for(var e of enemies){var a=Math.atan2(p.y-e.y,p.x-e.x),dd=d(p,e);if(dd>120){e.x+=Math.cos(a)*e.spd;e.y+=Math.sin(a)*e.spd}if(--e.cool<=0&&dd<600){shoot(e,p.x,p.y);e.cool=r(45,90)}}
 for(var s of shots){s.x+=s.vx;s.y+=s.vy;s.life--;if(s.team==="p"){for(var e2 of enemies)if(e2.hp>0&&d(s,e2)<20){e2.hp-=s.damage;s.life=0;burst(e2.x,e2.y,s.col,4);if(e2.hp<=0){score++;if(Math.random()<.25)loot.push({x:e2.x,y:e2.y,type:"weapon",ri:rarity()})}}}else if(d(s,p)<20){s.life=0;if(p.sh>0)p.sh=Math.max(0,p.sh-s.damage);else p.hp-=s.damage;if(p.hp<=0){over=true;won=false}}}
 shots=shots.filter(function(s){return s.life>0&&s.x>-60&&s.x<W+60&&s.y>40&&s.y<H+60});
 loot=loot.filter(function(l){if(d(l,p)<28){if(l.type==="weapon"){p.weapon=Math.max(p.weapon,l.ri);burst(l.x,l.y,rarities[l.ri][1],15)}else if(l.type==="shield")p.sh=Math.min(100,p.sh+40);else p.hp=Math.min(100,p.hp+30);return false}return true});
 parts.forEach(function(q){q.x+=q.vx;q.y+=q.vy;q.life--});parts=parts.filter(function(q){return q.life>0});
 if(enemies.length===0){if(wave>=12){over=true;won=true}else{wave++;p.hp=Math.min(100,p.hp+15);p.sh=Math.min(100,p.sh+25);spawn();for(var i=0;i<4;i++)loot.push({x:r(60,W-60),y:r(100,H-70),type:Math.random()<.5?"shield":"heal"})}}
 hud()
}
function draw(){
 ctx.clearRect(0,0,W,H);
 var g=ctx.createRadialGradient(W*.5,H*.4,20,W*.5,H*.5,Math.max(W,H));g.addColorStop(0,"#18285e");g.addColorStop(1,"#03050d");ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
 ctx.strokeStyle="#4bbdff22";for(var y=H*.6;y<H;y+=28){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}
 for(var i=0;i<22;i++){var bw=r(30,75),bh=r(60,Math.min(250,H*.38)),bx=i*W/21;ctx.fillStyle=i%2?"#09162e":"#0d1f3c";ctx.fillRect(bx,H*.6-bh,bw,bh)}
 var rg=ctx.createRadialGradient(W*.78,H*.18,3,W*.78,H*.18,105);rg.addColorStop(0,"#fff");rg.addColorStop(.15,"#db5cff");rg.addColorStop(1,"transparent");ctx.fillStyle=rg;ctx.beginPath();ctx.arc(W*.78,H*.18,105,0,7);ctx.fill();
 loot.forEach(function(l){var col=l.type==="weapon"?rarities[l.ri][1]:l.type==="shield"?"#48eaff":"#68ff77";ctx.fillStyle=col;ctx.shadowBlur=18;ctx.shadowColor=col;ctx.beginPath();ctx.arc(l.x,l.y,9,0,7);ctx.fill();ctx.shadowBlur=0});
 shots.forEach(function(s){ctx.fillStyle=s.col;ctx.shadowBlur=12;ctx.shadowColor=s.col;ctx.beginPath();ctx.arc(s.x,s.y,4,0,7);ctx.fill();ctx.shadowBlur=0});
 enemies.forEach(function(e){var a=Math.atan2(p.y-e.y,p.x-e.x),col=e.elite?"#ffb32f":"#ff3f8f";ctx.save();ctx.translate(e.x,e.y);ctx.rotate(a);ctx.fillStyle=col;ctx.shadowBlur=15;ctx.shadowColor=col;ctx.beginPath();ctx.moveTo(e.elite?23:18,0);ctx.lineTo(-13,-11);ctx.lineTo(-8,0);ctx.lineTo(-13,11);ctx.closePath();ctx.fill();ctx.shadowBlur=0;ctx.fillStyle="#111";ctx.fillRect(-17,-20,34,4);ctx.fillStyle=col;ctx.fillRect(-17,-20,34*Math.max(0,e.hp/e.max),4);ctx.restore()});
 var pc=rarities[rarity()][1];ctx.save();ctx.translate(p.x,p.y);ctx.rotate(Math.atan2(mouse.y-p.y,mouse.x-p.x));ctx.fillStyle=pc;ctx.shadowBlur=24;ctx.shadowColor=pc;ctx.beginPath();ctx.moveTo(23,0);ctx.lineTo(-14,-12);ctx.lineTo(-7,0);ctx.lineTo(-14,12);ctx.closePath();ctx.fill();ctx.restore();
 parts.forEach(function(q){ctx.globalAlpha=q.life/35;ctx.fillStyle=q.c;ctx.fillRect(q.x,q.y,3,3)});ctx.globalAlpha=1;
 if(over){ctx.fillStyle="#000b";ctx.fillRect(0,0,W,H);ctx.textAlign="center";ctx.font="900 46px Arial";ctx.fillStyle=won?"#6df7ff":"#ff5b9d";ctx.fillText(won?"EXILED VICTORY":"ELIMINATED",W/2,H/2);ctx.font="18px Arial";ctx.fillStyle="#fff";ctx.fillText("Tap FIRE or press R to restart",W/2,H/2+38);ctx.textAlign="left"}
}
function frame(){update();draw();requestAnimationFrame(frame)}
addEventListener("resize",resize);resize();start();frame();

addEventListener("keydown",function(e){keys[e.key.toLowerCase()]=true;if(e.key==="r"||e.key==="R")start()});
addEventListener("keyup",function(e){keys[e.key.toLowerCase()]=false});
addEventListener("mousemove",function(e){mouse.x=e.clientX;mouse.y=e.clientY});
addEventListener("mousedown",function(){if(over){start()}else mouse.down=true});
addEventListener("mouseup",function(){mouse.down=false});
addEventListener("blur",function(){mouse.down=false;keys={}});

var joyEl=document.getElementById("joy"),knob=document.getElementById("knob"),joyId=null;
function setJoy(e){var rr=joyEl.getBoundingClientRect(),cx=rr.left+rr.width/2,cy=rr.top+rr.height/2,dx=e.clientX-cx,dy=e.clientY-cy,dd=Math.hypot(dx,dy)||1,m=42;if(dd>m){dx=dx/dd*m;dy=dy/dd*m}joy.x=dx/m;joy.y=dy/m;knob.style.transform="translate("+dx+"px,"+dy+"px)"}
function endJoy(){joyId=null;joy.x=joy.y=0;knob.style.transform="translate(0,0)"}
joyEl.addEventListener("pointerdown",function(e){joyId=e.pointerId;joyEl.setPointerCapture(e.pointerId);setJoy(e)});
joyEl.addEventListener("pointermove",function(e){if(e.pointerId===joyId)setJoy(e)});
joyEl.addEventListener("pointerup",endJoy);joyEl.addEventListener("pointercancel",endJoy);
var fire=document.getElementById("fire"),dash=document.getElementById("dash");
fire.addEventListener("pointerdown",function(e){e.preventDefault();if(over){start();return}mouse.down=true});
fire.addEventListener("pointerup",function(){mouse.down=false});fire.addEventListener("pointercancel",function(){mouse.down=false});
dash.addEventListener("pointerdown",function(e){e.preventDefault();keys.shift=true;setTimeout(function(){keys.shift=false},100)});

window.onerror=function(msg,src,line,col){var box=document.getElementById("error");box.style.display="block";box.textContent="GAME ERROR:\\n"+msg+"\\nLine "+line+" Col "+col};
})();
</script></body></html>
